<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 485 200" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0d" />
      <stop offset="100%" stop-color="#0d0d11" />
    </linearGradient>
    <linearGradient id="trophy-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="100%" stop-color="#f5b041" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style><![CDATA[
    text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      fill: #ffffff;
    }
    .header {
      font-size: 18px;
      font-weight: bold;
      fill: #bf55ec;
    }
    .trophy-title {
      font-size: 13px;
      font-weight: 700;
      fill: #ffffff;
    }
    .trophy-desc {
      font-size: 11px;
      fill: #8b949e;
    }
    
    /* Pop-in animation for cells */
    .trophy-cell {
      opacity: 0;
      transform: scale(0.8);
      transform-origin: center;
      animation: popIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes popIn {
      to { transform: scale(1); opacity: 1; }
    }
  ]]></style>

  <rect width="485" height="200" rx="16" fill="url(#card-bg)" stroke="#2a2a2a" stroke-width="1.5" filter="url(#shadow)" />

  <text x="25" y="35" class="header">Milestone Achievements</text>

  <g transform="translate(25, 60)">
    <!-- Trophy 1 -->
    <g class="trophy-cell" style="animation-delay: 0.1s;">
      <rect width="135" height="110" rx="12" fill="#141419" stroke="#2a2a2a" stroke-width="1.2" />
      <!-- Trophy Icon -->
      <path d="M67.5,25 C58,25 54,32 54,32 L54,42 C54,50 62,56 67.5,56 C73,56 81,50 81,42 L81,32 C81,32 77,25 67.5,25 Z" fill="url(#trophy-gold)" filter="url(#glow)" />
      <path d="M54,32 L47,32 C43,32 43,38 47,38 L54,38 Z" fill="url(#trophy-gold)" />
      <path d="M81,32 L88,32 C92,32 92,38 88,38 L81,38 Z" fill="url(#trophy-gold)" />
      <rect x="63" y="56" width="9" height="10" fill="url(#trophy-gold)" />
      <ellipse cx="67.5" cy="68" rx="16" ry="4" fill="url(#trophy-gold)" />
      
      <text x="67.5" y="85" class="trophy-title" text-anchor="middle">PR Master</text>
      <text x="67.5" y="98" class="trophy-desc" text-anchor="middle">87 PRs Merged</text>
    </g>

    <!-- Trophy 2 -->
    <g class="trophy-cell" transform="translate(150, 0)" style="animation-delay: 0.3s;">
      <rect width="135" height="110" rx="12" fill="#141419" stroke="#2a2a2a" stroke-width="1.2" />
      <!-- Star Icon -->
      <path d="M217.5,25 L222,35 L232,36.5 L224.5,44 L226.5,54.5 L217.5,49 L208.5,54.5 L210.5,44 L203,36.5 L213,35 Z" transform="translate(-150, 0)" fill="#00f0ff" filter="url(#glow)" />
      <text x="67.5" y="85" class="trophy-title" text-anchor="middle">Star Gazed</text>
      <text x="67.5" y="98" class="trophy-desc" text-anchor="middle">300+ Stars Earned</text>
    </g>

    <!-- Trophy 3 -->
    <g class="trophy-cell" transform="translate(300, 0)" style="animation-delay: 0.5s;">
      <rect width="135" height="110" rx="12" fill="#141419" stroke="#2a2a2a" stroke-width="1.2" />
      <!-- Flame/Commit Icon -->
      <path d="M367.5,22 C367.5,22 376.5,32 376.5,41 C376.5,47.5 372.5,52.5 367.5,52.5 C362.5,52.5 358.5,47.5 358.5,41 C358.5,32 367.5,22 Z" transform="translate(-300, 0)" fill="#ff2a85" filter="url(#glow)" />
      <text x="67.5" y="85" class="trophy-title" text-anchor="middle">Code Flame</text>
      <text x="67.5" y="98" class="trophy-desc" text-anchor="middle">1.2K+ Commits</text>
    </g>
  </g>
</svg>
