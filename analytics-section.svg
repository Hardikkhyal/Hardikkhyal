<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" width="800">
  <rect width="800" height="130" fill="#0d1117"/>

  <!-- Card 1: PROGRAMMING -->
  <rect x="0" y="0" width="190" height="130" rx="14" fill="#12121c" stroke="#28283a" stroke-width="1"/>
  <text x="12" y="24" font-family="monospace" font-size="9" font-weight="700" fill="#8b949e" letter-spacing="1">PROGRAMMING</text>
  <text x="12" y="52" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="800" fill="#f0f6fc">80+ Hours</text>
