  <polyline points="12,115 30,102 50,108 70,88 90,96 110,78 130,84 150,70 170,76" fill="none" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Card 2: DESIGN -->
