  <text x="420" y="24" font-family="monospace" font-size="9" font-weight="700" fill="#8b949e" letter-spacing="1">DEVOPS</text>
  <text x="420" y="52" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="800" fill="#f0f6fc">34+ Hours</text>
  <text x="420" y="70" font-family="monospace" font-size="9" fill="#3b82f6">This Month</text>
  <polyline points="420,118 440,108 460,115 480,96 500,102 520,84 540,90 560,74 578,80" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

