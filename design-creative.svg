      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="800" height="450" rx="24" fill="#10101a" stroke="#28283c" stroke-width="1"/>

  <!-- Header -->
  <text x="22" y="48" font-family="'Segoe UI',Arial,sans-serif" font-size="24" font-weight="800" fill="#ec4899" letter-spacing="-0.5">DESIGN &amp; CREATIVE</text>
  <rect x="646" y="26" width="130" height="28" rx="12" fill="#2a1a2e" stroke="#ec4899" stroke-width="1"/>
  <text x="711" y="44" font-family="monospace" font-size="11" font-weight="700" fill="#ec4899" text-anchor="middle">3 TOOLS</text>
  <line x1="22" y1="68" x2="778" y2="68" stroke="#222236" stroke-width="1"/>

  <!-- Figma Row -->
  <rect x="14" y="82" width="772" height="86" rx="14" fill="#161622" stroke="#28283a" stroke-width="1"/>
