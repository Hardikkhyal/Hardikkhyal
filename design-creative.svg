  <text x="32" y="217" font-family="monospace" font-size="12" font-weight="700" fill="white">Ps</text>
  <text x="66" y="211" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#f0f6fc">Photoshop</text>
  <text x="66" y="227" font-family="monospace" font-size="10" fill="#8b949e">IMAGE EDITING</text>
  <text x="740" y="204" font-family="monospace" font-size="13" font-weight="700" fill="#3b82f6" text-anchor="end">96%</text>
