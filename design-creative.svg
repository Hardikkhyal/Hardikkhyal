  <line x1="26" y1="348" x2="774" y2="348" stroke="#222232" stroke-width="1"/>
  <text x="400" y="362" font-family="'Segoe UI',Arial,sans-serif" font-size="11.5" fill="#8b949e" text-anchor="middle">Rapid landing pages.</text>

  <!-- Info Box -->
  <rect x="14" y="382" width="772" height="56" rx="16" fill="#1a1526" stroke="#4d334d" stroke-width="1"/>
  <text x="30" y="404" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#ec4899">Design Philosophy</text>
  <text x="30" y="424" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#8b949e">I believe design should communicate functionality before decoration while remaining visually memorable.</text>
