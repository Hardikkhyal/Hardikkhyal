  <text x="32" y="117" font-family="monospace" font-size="12" font-weight="700" fill="white">Fi</text>
  <text x="66" y="111" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#f0f6fc">Figma</text>
