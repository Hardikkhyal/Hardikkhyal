  <!-- Framer Row -->
  <rect x="14" y="282" width="772" height="86" rx="14" fill="#161622" stroke="#28283a" stroke-width="1"/>
  <rect x="26" y="296" width="30" height="30" rx="7" fill="#0055FF"/>
  <text x="32" y="317" font-family="monospace" font-size="12" font-weight="700" fill="white">Fr</text>
  <text x="66" y="311" font-family="'Segoe UI',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#f0f6fc">Framer</text>
