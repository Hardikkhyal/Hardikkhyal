<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800">
  <defs>
    <linearGradient id="pg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Card background -->
  <rect width="800" height="480" rx="24" fill="#0d0d11" stroke="#28283c" stroke-width="1"/>

  <!-- Header -->
  <text x="22" y="48" font-family="'Segoe UI',Arial,sans-serif" font-size="24" font-weight="800" fill="#f0f6fc" letter-spacing="-0.5">PROGRAMMING &amp; DEVOPS</text>
  <rect x="636" y="26" width="140" height="28" rx="12" fill="#1e1e2e" stroke="#28283a" stroke-width="1"/>
  <text x="706" y="44" font-family="monospace" font-size="11" font-weight="700" fill="#f0f6fc" text-anchor="middle">8 TECHS</text>
  <line x1="22" y1="68" x2="778" y2="68" stroke="#222236" stroke-width="1"/>

  <!-- Row 1 Tech Cards: Docker, Node.js, React, Python -->

  <!-- Docker -->
  <rect x="14" y="82" width="181" height="108" rx="14" fill="#161622" stroke="#28283a" stroke-width="1"/>
  <rect x="26" y="96" width="30" height="30" rx="7" fill="#2496ED"/>
  <text x="34" y="117" font-family="monospace" font-size="11" font-weight="700" fill="white">Do</text>
  <text x="66" y="111" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">Docker</text>
  <text x="66" y="126" font-family="monospace" font-size="10" fill="#8b949e">CONTAINER</text>
  <line x1="26" y1="140" x2="183" y2="140" stroke="#222232" stroke-width="1"/>
  <text x="105" y="157" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Reproducible deployments.</text>

  <!-- Node.js -->
  <rect x="207" y="82" width="181" height="108" rx="14" fill="#161622" stroke="#28283a" stroke-width="1"/>
  <rect x="219" y="96" width="30" height="30" rx="7" fill="#5FA04E"/>
  <text x="227" y="117" font-family="monospace" font-size="11" font-weight="700" fill="white">Nj</text>
  <text x="259" y="111" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">Node.js</text>
  <text x="259" y="126" font-family="monospace" font-size="10" fill="#8b949e">BACKEND</text>
  <line x1="219" y1="140" x2="376" y2="140" stroke="#222232" stroke-width="1"/>
  <text x="297" y="157" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">APIs, auth &amp; microservices.</text>

  <!-- React -->
  <rect x="400" y="82" width="181" height="108" rx="14" fill="#161622" stroke="#28283a" stroke-width="1"/>
  <rect x="412" y="96" width="30" height="30" rx="7" fill="#20232a"/>
  <text x="417" y="117" font-family="monospace" font-size="11" font-weight="700" fill="#61DAFB">Re</text>
  <text x="452" y="111" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">React</text>
  <text x="452" y="126" font-family="monospace" font-size="10" fill="#8b949e">FRONTEND</text>
  <line x1="412" y1="140" x2="569" y2="140" stroke="#222232" stroke-width="1"/>
  <text x="490" y="157" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Modern reusable UI.</text>

  <!-- Python -->
  <rect x="593" y="82" width="193" height="108" rx="14" fill="#161622" stroke="#28283a" stroke-width="1"/>
  <rect x="605" y="96" width="30" height="30" rx="7" fill="#3776AB"/>
  <text x="612" y="117" font-family="monospace" font-size="11" font-weight="700" fill="white">Py</text>
  <text x="645" y="111" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">Python</text>
  <text x="645" y="126" font-family="monospace" font-size="10" fill="#8b949e">SCRIPTING</text>
  <line x1="605" y1="140" x2="774" y2="140" stroke="#222232" stroke-width="1"/>
  <text x="689" y="157" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Automation &amp; scripting.</text>

  <!-- Row 2 Tech Cards: Kubernetes, Git, SQLite, Terraform -->

  <!-- Kubernetes -->
  <rect x="14" y="204" width="181" height="108" rx="14" fill="#161622" stroke="#28283a" stroke-width="1"/>
  <rect x="26" y="218" width="30" height="30" rx="7" fill="#326CE5"/>
  <text x="31" y="239" font-family="monospace" font-size="11" font-weight="700" fill="white">K8s</text>
  <text x="66" y="233" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">Kubernetes</text>
  <text x="66" y="248" font-family="monospace" font-size="10" fill="#8b949e">ORCHESTRATION</text>
  <line x1="26" y1="262" x2="183" y2="262" stroke="#222232" stroke-width="1"/>
  <text x="105" y="279" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Container orchestration.</text>

  <!-- Git -->
  <rect x="207" y="204" width="181" height="108" rx="14" fill="#161622" stroke="#28283a" stroke-width="1"/>
  <rect x="219" y="218" width="30" height="30" rx="7" fill="#F05032"/>
  <text x="226" y="239" font-family="monospace" font-size="11" font-weight="700" fill="white">Gi</text>
  <text x="259" y="233" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">Git</text>
  <text x="259" y="248" font-family="monospace" font-size="10" fill="#8b949e">GIT CONTROL</text>
  <line x1="219" y1="262" x2="376" y2="262" stroke="#222232" stroke-width="1"/>
  <text x="297" y="279" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Version control &amp; branching.</text>

  <!-- SQLite -->
  <rect x="400" y="204" width="181" height="108" rx="14" fill="#161622" stroke="#28283a" stroke-width="1"/>
  <rect x="412" y="218" width="30" height="30" rx="7" fill="#003B57"/>
  <text x="416" y="239" font-family="monospace" font-size="11" font-weight="700" fill="white">SQ</text>
  <text x="452" y="233" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">SQLite</text>
  <text x="452" y="248" font-family="monospace" font-size="10" fill="#8b949e">DATABASE</text>
  <line x1="412" y1="262" x2="569" y2="262" stroke="#222232" stroke-width="1"/>
  <text x="490" y="279" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Embedded relational DB.</text>

  <!-- Terraform -->
  <rect x="593" y="204" width="193" height="108" rx="14" fill="#161622" stroke="#28283a" stroke-width="1"/>
  <rect x="605" y="218" width="30" height="30" rx="7" fill="#844FBA"/>
  <text x="612" y="239" font-family="monospace" font-size="11" font-weight="700" fill="white">Tf</text>
  <text x="645" y="233" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">Terraform</text>
  <text x="645" y="248" font-family="monospace" font-size="10" fill="#8b949e">IaC</text>
  <line x1="605" y1="262" x2="774" y2="262" stroke="#222232" stroke-width="1"/>
  <text x="689" y="279" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Automated cloud setup.</text>

  <!-- Info Box -->
  <rect x="14" y="328" width="772" height="136" rx="18" fill="#161622" stroke="#28283a" stroke-width="1"/>
  <text x="30" y="356" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">Why these technologies?</text>
  <text x="30" y="380" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#8b949e">I focus on scalable, production-ready technologies that are widely adopted in modern software</text>
  <text x="30" y="400" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#8b949e">engineering. Each tool in this stack is used daily and chosen based on real-world performance,</text>
  <text x="30" y="420" font-family="'Segoe UI',Arial,sans-serif" font-size="12.5" fill="#8b949e">community support, and how well it integrates with the rest of the ecosystem.</text>
  <text x="30" y="448" font-family="monospace" font-size="11" fill="#f0f6fc">Primary: Node.js + React    Secondary: Python + Docker    Infrastructure: Kubernetes + Terraform</text>
</svg>
