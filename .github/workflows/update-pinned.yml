name: Update Pinned Repositories

on:
  schedule:
    # Run once every 24 hours
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-pinned.yml'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Pinned Repos and Update README
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const query = `
              query($username: String!) {
                user(login: $username) {
                  pinnedItems(first: 6, types: REPOSITORY) {
                    nodes {
                      ... on Repository {
                        name
                        description
                        url
                        stargazerCount
                        forkCount
                        primaryLanguage {
                          name
                          color
                        }
                      }
                    }
                  }
                }
              }
            `;

            try {
              const response = await github.graphql(query, { username: 'Hardikkhyal' });
              const repos = response.user.pinnedItems.nodes;

              if (!repos || repos.length === 0) {
                console.log('No pinned repositories found.');
                return;
              }

              let html = '\n<div align="center">\n<table width="100%" border="0" cellpadding="0" cellspacing="0" style="border-collapse: collapse; border: none; margin-top: 15px;">\n';

              for (let i = 0; i < repos.length; i += 2) {
                html += '<tr>\n';
                for (let j = i; j < i + 2; j++) {
                  if (j < repos.length) {
                    const repo = repos[j];
                    const desc = repo.description || 'No description provided.';
                    const lang = repo.primaryLanguage ? repo.primaryLanguage.name : 'Code';
                    const langColor = repo.primaryLanguage ? repo.primaryLanguage.color : '#3b82f6';
                    const stars = repo.stargazerCount;
                    const forks = repo.forkCount;

                    html += `  <td width="50%" valign="top" style="border: none; padding: 6px;">\n`;
                    html += `    <div style="background-color: #141419; border: 1px solid #2a2a2a; border-radius: 12px; padding: 16px; text-align: left;">\n`;
                    html += `      <a href="${repo.url}" target="_blank" style="color: #bf55ec; font-size: 15px; font-weight: 700; text-decoration: none; font-family: monospace;">📦 ${repo.name}</a>\n`;
                    html += `      <p style="color: #8b949e; font-size: 12.5px; margin: 8px 0; line-height: 1.4; font-family: -apple-system, BlinkMacSystemFont, sans-serif;">${desc}</p>\n`;
                    html += `      <div style="font-family: monospace; font-size: 11px; color: #8b949e;">\n`;
                    html += `        <span style="color: ${langColor};">● ${lang}</span> &nbsp;&nbsp;`;
                    html += `<span>⭐ ${stars}</span> &nbsp;&nbsp;`;
                    html += `<span>🍴 ${forks}</span>\n`;
                    html += `      </div>\n`;
                    html += `    </div>\n`;
                    html += `  </td>\n`;
                  } else {
                    html += `  <td width="50%" style="border: none;"></td>\n`;
                  }
                }
                html += '</tr>\n';
              }

              html += '</table>\n</div>\n';

              let readme = fs.readFileSync('README.md', 'utf8');
              const startTag = '<!-- PINNED-REPOS:START -->';
              const endTag = '<!-- PINNED-REPOS:END -->';

              const regex = new RegExp(`${startTag}[\\s\\S]*?${endTag}`, 'm');
              const newContent = `${startTag}${html}${endTag}`;

              if (regex.test(readme)) {
                readme = readme.replace(regex, newContent);
                fs.writeFileSync('README.md', readme, 'utf8');
                console.log('README.md updated with pinned repos successfully.');
              } else {
                console.log('Start and end tags not found in README.md.');
              }
            } catch (err) {
              console.error('Error fetching pinned repos:', err);
            }

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update pinned repositories showcase" && git push)
