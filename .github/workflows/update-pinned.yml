name: Update Pinned Repositories

on:
  schedule:
    # Run once every 24 hours
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-pinned.yml'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Pinned Repos and Generate SVG + Update README
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            function escapeXml(str) {
              if (!str) return '';
              return str.replace(/[<>&"']/g, (c) => {
                switch (c) {
                  case '<': return '&lt;';
                  case '>': return '&gt;';
                  case '&': return '&amp;';
                  case '"': return '&quot;';
                  case "'": return '&apos;';
                  default: return c;
                }
              });
            }

            function wrapText(text, maxChars = 34, maxLines = 4) {
              if (!text) return ['• Open source project on GitHub'];
              const words = text.split(/\s+/);
              const lines = [];
              let current = '';

              for (const word of words) {
                if ((current + ' ' + word).trim().length <= maxChars) {
                  current = (current + ' ' + word).trim();
                } else {
                  if (current) lines.push(current);
                  current = word;
                  if (lines.length === maxLines - 1) break;
                }
              }
              if (current && lines.length < maxLines) {
                lines.push(current);
              }
              return lines.map(l => '• ' + l);
            }

            const query = `
              query($username: String!) {
                user(login: $username) {
                  pinnedItems(first: 3, types: REPOSITORY) {
                    nodes {
                      ... on Repository {
                        name
                        description
                        url
                        stargazerCount
                        forkCount
                        primaryLanguage {
                          name
                          color
                        }
                      }
                    }
                  }
                }
              }
            `;

            try {
              const response = await github.graphql(query, { username: 'Hardikkhyal' });
              let repos = response.user.pinnedItems.nodes;
              if (repos) repos = repos.slice(0, 3);

              if (!repos || repos.length === 0) {
                console.log('No pinned repositories found.');
                return;
              }

              // 1. Generate projects-section.svg matching the exact card design
              const cardWidth = 254;
              const cardHeight = 230;
              const colGap = 19;
              const rowGap = 20;

              const totalRows = Math.ceil(repos.length / 3);
              const svgHeight = 54 + (totalRows * cardHeight) + ((totalRows - 1) * rowGap) + 20;

              let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 ${svgHeight}" width="800">\n`;
              svg += `  <rect width="800" height="${svgHeight}" fill="#0d0d11"/>\n\n`;
              svg += `  <!-- Section Title -->\n`;
              svg += `  <text x="400" y="34" font-family="'Segoe UI',Arial,sans-serif" font-size="24" font-weight="800" fill="#f0f6fc" text-anchor="middle" letter-spacing="-0.5">Curated Projects</text>\n\n`;

              for (let i = 0; i < repos.length; i++) {
                const repo = repos[i];
                const row = Math.floor(i / 3);
                const col = i % 3;

                const cardX = col * (cardWidth + colGap);
                const cardY = 54 + row * (cardHeight + rowGap);
                const centerX = cardX + (cardWidth / 2);

                const name = escapeXml(repo.name);
                const descLines = wrapText(repo.description, 33, 4);
                const lang = repo.primaryLanguage ? escapeXml(repo.primaryLanguage.name) : 'Code';
                const stars = repo.stargazerCount;
                const forks = repo.forkCount;

                svg += `  <!-- Card ${i + 1}: ${name} -->\n`;
                svg += `  <rect x="${cardX}" y="${cardY}" width="${cardWidth}" height="${cardHeight}" rx="12" fill="#141419" stroke="#2a2a2a" stroke-width="1"/>\n`;
                svg += `  <text x="${centerX}" y="${cardY + 42}" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#f0f6fc" text-anchor="middle">${name}</text>\n`;
                svg += `  <line x1="${cardX + 16}" y1="${cardY + 54}" x2="${cardX + 238}" y2="${cardY + 54}" stroke="#2a2a2a" stroke-width="1"/>\n`;

                descLines.forEach((line, lineIdx) => {
                  const lineY = cardY + 80 + (lineIdx * 22);
                  svg += `  <text x="${cardX + 16}" y="${lineY}" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#8b949e">${escapeXml(line)}</text>\n`;
                });

                svg += `  <text x="${centerX}" y="${cardY + 195}" font-family="monospace" font-size="10" fill="#bf55ec" text-anchor="middle">${lang} • ⭐ ${stars} • 🍴 ${forks}</text>\n\n`;
              }

              svg += `</svg>\n`;

              fs.writeFileSync('projects-section.svg', svg, 'utf8');
              console.log('projects-section.svg generated successfully.');

              // 2. Update README.md clickable links section under SVG
              let linksHtml = '<p align="center" style="font-family: monospace; font-size: 13px;">\n  ';
              linksHtml += repos.map(r => `<a href="${r.url}"><b>${escapeXml(r.name)} Source Code</b></a>`).join(' &nbsp;•&nbsp; \n  ');
              linksHtml += '\n</p>';

              let readme = fs.readFileSync('README.md', 'utf8');
              const startTag = '<!-- PINNED-REPOS:START -->';
              const endTag = '<!-- PINNED-REPOS:END -->';

              const regex = new RegExp(`${startTag}[\\s\\S]*?${endTag}`, 'm');
              const newContent = `${startTag}\n${linksHtml}\n${endTag}`;

              if (regex.test(readme)) {
                readme = readme.replace(regex, newContent);
                fs.writeFileSync('README.md', readme, 'utf8');
                console.log('README.md updated with pinned source links.');
              }
            } catch (err) {
              console.error('Error in script:', err);
            }

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add projects-section.svg README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: regenerate projects-section.svg from pinned repos" && git push)
